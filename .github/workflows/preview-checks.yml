name: Preview checks

# Builds the pull request locally and runs the cross-browser end-to-end tests
# and Lighthouse budgets against that production build.
#
# Why not the Vercel preview URL: previews sit behind Deployment Protection and
# Vercel sends `x-robots-tag: noindex`, while the API only allows a fixed CORS
# origin list. Auditing the deployment directly therefore fails on SEO, console
# errors and authenticated pages. `http://localhost:3000` is an allowed API
# origin, has a valid robots.txt and serves the same commit, so this runs the
# build the way the README's local results were produced.
#
# Repository settings:
#   secrets.E2E_EMAIL / E2E_PASSWORD   a demo account in the shared Supabase project
#   vars.E2E_API_URL                   API the build talks to (production)
# Fresh sign-up flows (checkout, DRM device limit) need a Supabase project with
# email confirmation off; set E2E_FRESH_SIGNUP=1 there.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Public config is inlined at build time so the local build talks to the
  # shared production API and Supabase project.
  NEXT_PUBLIC_API_URL: ${{ vars.E2E_API_URL || 'https://thumbz-server-production.up.railway.app/api/v1' }}
  NEXT_PUBLIC_SUPABASE_URL: https://qshjcszsvsgwpcgggkiv.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_o87DH8dOSULCVGmz1aTLhA_OStJipIq
  NEXT_PUBLIC_SITE_URL: https://thumbz-next-client.vercel.app

jobs:
  e2e:
    name: Playwright (Chrome, Safari, iPhone, Pixel)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Run Playwright against the production build
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: ${{ vars.E2E_API_URL || 'https://thumbz-server-production.up.railway.app/api/v1' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_SW: '1'
        run: |
          npm start > next.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000/robots.txt >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/robots.txt >/dev/null || { cat next.log; exit 1; }
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse budgets
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Collect and assert (lighthouserc.json budgets)
        run: |
          npm start > next.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000/robots.txt >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/robots.txt >/dev/null || { cat next.log; exit 1; }
          npx -y @lhci/cli@0.15.1 collect
          npx -y @lhci/cli@0.15.1 assert
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14
